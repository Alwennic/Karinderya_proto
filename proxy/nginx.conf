server {
    listen 80;

    location / {
        proxy_pass http://frontend:80;
    }

    # the trailing slash on proxy_pass removes the /api/menu/ prefix
    location /api/menu/ {
        proxy_pass http://catalog-api:5000/;
    }

    location /api/auth/ {
        proxy_pass http://auth-api:3000/;
    }
}