<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karinderya_proto: Manage Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Karinderya_proto</a>
      <nav>
        <a href="index.html">View menu</a>
        <button type="button" id="logoutBtn">Log out</button>
      </nav>
    </div>
  </header>

  <main>
    <h1>Manage menu</h1>
    <p class="sub">Add a new item or pick Edit to change an existing one.</p>

    <div class="admin-grid">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2 id="formTitle">Add item</h2>
        <input type="hidden" id="itemId">

        <label for="name">Name</label>
        <input type="text" id="name">

        <label for="category">Category</label>
        <input type="text" id="category" placeholder="Rice Meals, Noodles, Drinks...">

        <label for="price">Price (PHP)</label>
        <input type="number" id="price" min="0" step="0.01">

        <label class="check"><input type="checkbox" id="available" checked> Available today</label>

        <button class="btn" id="saveBtn" type="button">Save item</button>
        <button class="btn secondary" id="cancelBtn" type="button">Clear form</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </div>
  </main>

  <footer>Karinderya_proto &middot; Build <span id="build">__BUILD_NUMBER__</span></footer>

  <script src="app.js"></script>
  <script>
    // Staff only: no token means back to the login page
    if (!getToken()) window.location.href = "login.html";

    const status = document.getElementById("status");
    let currentItems = [];

    function say(text, kind) {
      status.className = "status " + (kind || "");
      status.textContent = text;
    }

    function clearForm() {
      document.getElementById("itemId").value = "";
      document.getElementById("name").value = "";
      document.getElementById("category").value = "";
      document.getElementById("price").value = "";
      document.getElementById("available").checked = true;
      document.getElementById("formTitle").textContent = "Add item";
    }

    function editItem(item) {
      document.getElementById("itemId").value = item.id;
      document.getElementById("name").value = item.name;
      document.getElementById("category").value = item.category;
      document.getElementById("price").value = Number(item.price);
      document.getElementById("available").checked = Boolean(item.available);
      document.getElementById("formTitle").textContent = "Edit item";
      document.getElementById("name").focus();
    }

    async function loadRows() {
      const rows = document.getElementById("rows");
      rows.textContent = "";
      try {
        currentItems = await getItems();
      } catch (err) {
        say(err.message, "bad");
        return;
      }
      currentItems.forEach((item) => {
        const tr = document.createElement("tr");
        [item.name, item.category, formatPrice(item.price), item.available ? "Available" : "Sold out"]
          .forEach((text) => {
            const td = document.createElement("td");
            td.textContent = text;
            tr.appendChild(td);
          });
        const actionTd = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => editItem(item));
        actionTd.appendChild(editBtn);
        tr.appendChild(actionTd);
        rows.appendChild(tr);
      });
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const idValue = document.getElementById("itemId").value;
      const name = document.getElementById("name").value.trim();
      const category = document.getElementById("category").value.trim();
      const price = parseFloat(document.getElementById("price").value);

      if (!name || !category || isNaN(price) || price < 0) {
        say("Fill in the name, category and a price of 0 or more.", "bad");
        return;
      }
      const item = {
        name,
        category,
        price,
        available: document.getElementById("available").checked
      };
      if (idValue) item.id = Number(idValue);

      try {
        await saveItem(item);
        say("Saved " + name + ".", "good");
        clearForm();
        loadRows();
      } catch (err) {
        say(err.message, "bad");
        if (!getToken()) window.location.href = "login.html";
      }
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      clearForm();
      say("");
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearToken();
      window.location.href = "login.html";
    });

    loadRows();

    const build = document.getElementById("build");
    if (build.textContent.startsWith("__")) build.textContent = "dev";
  </script>
</body>
</html>
