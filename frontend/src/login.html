<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karinderya_proto: Staff Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Karinderya_proto</a>
      <nav><a href="index.html">View menu</a></nav>
    </div>
  </header>

  <main>
    <h1>Staff login</h1>
    <p class="sub">Only canteen staff can add or edit menu items.</p>

    <div class="panel">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">

      <button class="btn" id="loginBtn" type="button">Log in</button>
      <p class="status" id="status" role="status"></p>
      <p class="sub" id="demoHint" hidden>Demo mode: use admin / admin123</p>
    </div>
  </main>

  <footer>Karinderya_proto &middot; Build <span id="build">__BUILD_NUMBER__</span></footer>

  <script src="app.js"></script>
  <script>
    const status = document.getElementById("status");
    const btn = document.getElementById("loginBtn");

    if (USE_MOCK) document.getElementById("demoHint").hidden = false;

    async function doLogin() {
      status.className = "status";
      status.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) {
        status.className = "status bad";
        status.textContent = "Enter your username and password.";
        return;
      }
      btn.disabled = true;
      try {
        const token = await login(username, password);
        setToken(token);
        window.location.href = "admin.html";
      } catch (err) {
        status.className = "status bad";
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });

    const build = document.getElementById("build");
    if (build.textContent.startsWith("__")) build.textContent = "dev";
  </script>
</body>
</html>
