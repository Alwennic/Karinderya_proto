services:
  proxy:
    build: ./proxy
    image: karinderya_proto/proxy:${TAG:-latest}
    ports:
      - "8080:80"
    depends_on: [frontend, catalog-api, auth-api]
    restart: unless-stopped
    networks: [canteen-net]

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_NUMBER: ${TAG:-dev}      # printed in the page footer
    image: karinderya_proto/frontend:${TAG:-latest}
    restart: unless-stopped
    networks: [canteen-net]

  catalog-api:
    build:
      context: ./catalog-api
      target: production
    image: karinderya_proto/catalog-api:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_NAME: karinderya_proto
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [canteen-net]

  auth-api:
    build:
      context: ./auth-api
      target: production
    image: karinderya_proto/auth-api:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_NAME: karinderya_proto
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [canteen-net]

  db:
    build: ./db
    image: karinderya_proto/db:${TAG:-latest}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: karinderya_proto
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 uses TCP, so it only passes once the real server (after init.sql) is up
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [canteen-net]

volumes:
  db-data:

networks:
  canteen-net:
